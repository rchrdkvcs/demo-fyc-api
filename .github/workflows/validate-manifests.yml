name: Validate Kubernetes manifests

on:
  pull_request:
    paths:
      - 'deploy/kubernetes/**'
      - 'deploy/kustomize/**'
      - 'gitops/**'
  push:
    branches:
      - main
    paths:
      - 'deploy/kubernetes/**'
      - 'deploy/kustomize/**'
      - 'gitops/**'

permissions:
  contents: read

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Render staging overlay
        run: kubectl kustomize deploy/kustomize/overlays/staging >/dev/null

      - name: Render production overlay
        run: kubectl kustomize deploy/kustomize/overlays/production >/dev/null

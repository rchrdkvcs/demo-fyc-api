name: Create course tags

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/create-course-tags.yml'

permissions:
  contents: write

jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable learning checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r tag sha message; do
            if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
              continue
            fi
            git tag -a "${tag}" "${sha}" -m "${message}"
            git push origin "refs/tags/${tag}"
          done <<'TAGS'
          0.1 19a0c3363673b7f3ecfd51d881c04f7926523c77 Socle initial de l API AdonisJS et PostgreSQL
          1.1 2941128e74ecb3a4fd6b98655050f8aa322e22a8 Module 1 chapitre 1 : socle applicatif et hébergement
          1.2 06e70f2f31571a1a07cb531711e3aa7881aa9cfb Module 1 chapitre 2 : machines virtuelles et conteneurs
          1.3 f50353ce4e8afaed929d9b7b2f8b35490281f7b3 Module 1 chapitre 3 : Dockerfile de production
          1.4 8dc061a035051624713a264019084cf9153ff636 Module 1 chapitre 4 : Docker Compose et PostgreSQL
          1.5 24719d77ed52d3448b559ef9de2e1d0455948420 Module 1 chapitre 5 : registre d images
          1.6 e4335e2c36c38925046d07d9ba9a4cb742a48107 Module 1 chapitre 6 : déploiement manuel sur VPS
          2.1 1700acf5cdc8e44bff2b54946c74df949a999b96 Module 2 chapitre 1 : réplication avec Docker Swarm
          2.2 e3e4b63b59563f14492a9d8f85fa5b2867b22bf2 Module 2 chapitre 2 : déploiement Kubernetes local
          3.1 64ec47597620c22123777e62520632e8ec5ae537 Module 3 chapitre 1 : cloud public et Kubernetes managé
          3.2 0c578b81f437fb69d8b152d25caca7603af53a2b Module 3 chapitre 2 : stockage persistant et autoscaling
          3.3 b92372dd2baa5d2a07c05172b567eb1b6c39536b Module 3 chapitre 3 : PostgreSQL opéré avec CloudNativePG
          4.1 62a4c0c440ca5cf4ab3bc6d15faa4c9869c67e86 Module 4 chapitre 1 : Infrastructure as Code
          4.2 ab052b1ecd62770ff08ac3acb334d18d531ff061 Module 4 chapitre 2 : base et overlays Kustomize
          4.3 8b315e4b7b9c0ffc8bf160b88651099916027c4a Module 4 chapitre 3 : GitOps avec Argo CD
          # 4.3.1 is based on the pre-workflow checkpoint so the tag can be published by GITHUB_TOKEN.
          4.3.1 9bffa6227ac395ff88c6161aa1b6d2259d5f4356 Module 4 chapitre 3 : correctif Kustomize du checkpoint
          TAGS

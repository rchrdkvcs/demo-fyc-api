apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-fyc-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rchrdkvcs/demo-fyc-api.git
    targetRevision: main
    path: deploy/kustomize/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-fyc-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-fyc-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rchrdkvcs/demo-fyc-api.git
    targetRevision: main
    path: deploy/kustomize/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-fyc-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

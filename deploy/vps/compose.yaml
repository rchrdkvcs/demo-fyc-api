# Stack de production pour un VPS unique : image publiée sur GHCR + PostgreSQL.
# Les valeurs sensibles viennent du fichier .env placé à côté (voir .env.example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-demo_fyc}
      POSTGRES_USER: ${DB_USER:-demo_fyc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définissez DB_PASSWORD dans .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: ghcr.io/rchrdkvcs/demo-fyc-api:${API_TAG:-2.1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY:?Définissez APP_KEY dans .env}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-demo_fyc}
      DB_PASSWORD: ${DB_PASSWORD:?Définissez DB_PASSWORD dans .env}
      DB_DATABASE: ${DB_DATABASE:-demo_fyc}
    command: ['sh', '-c', 'node ace migration:run --force && node bin/server.js']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Uniquement sur la boucle locale : seul Nginx est exposé sur Internet.
    ports:
      - '127.0.0.1:3333:3333'

volumes:
  postgres_data:

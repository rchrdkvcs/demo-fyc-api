apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-fyc-api
  namespace: demo-fyc
spec:
  # Pas de champ replicas : le nombre de Pods est piloté par le HPA (06-hpa.yaml).
  # Mise à jour progressive : un Pod neuf en plus, jamais un Pod prêt en moins.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: demo-fyc-api
  template:
    metadata:
      labels:
        app: demo-fyc-api
    spec:
      securityContext:
        runAsNonRoot: true
        # Utilisateur « node » de l'image officielle Node.js.
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/rchrdkvcs/demo-fyc-api:2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3333
          envFrom:
            - configMapRef:
                name: demo-fyc-api-config
            - secretRef:
                name: demo-fyc-secrets
          # Vivant ? Sinon le kubelet redémarre le conteneur.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # Prêt ? Sinon le Pod est retiré du Service, sans redémarrage.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          # requests : réservé pour le placement et base du calcul du HPA.
          # limits : plafond ; au-delà de la mémoire, le conteneur est tué (OOMKilled).
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-fyc-api
  namespace: demo-fyc
spec:
  type: ClusterIP
  selector:
    app: demo-fyc-api
  ports:
    - name: http
      port: 3333
      targetPort: http

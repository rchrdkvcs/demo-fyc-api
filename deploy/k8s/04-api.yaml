apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-fyc-api
  namespace: demo-fyc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-fyc-api
  template:
    metadata:
      labels:
        app: demo-fyc-api
    spec:
      securityContext:
        runAsNonRoot: true
        # Utilisateur « node » de l'image officielle Node.js.
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/rchrdkvcs/demo-fyc-api:2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3333
          envFrom:
            - configMapRef:
                name: demo-fyc-api-config
            - secretRef:
                name: demo-fyc-secrets
          # Vivant ? Sinon le kubelet redémarre le conteneur.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # Prêt ? Sinon le Pod est retiré du Service, sans redémarrage.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-fyc-api
  namespace: demo-fyc
spec:
  type: ClusterIP
  selector:
    app: demo-fyc-api
  ports:
    - name: http
      port: 3333
      targetPort: http

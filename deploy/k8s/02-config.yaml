apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-fyc-api-config
  namespace: demo-fyc
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '3333'
  LOG_LEVEL: info
  APP_VERSION: '4.3'
  DB_HOST: demo-fyc-db
  DB_PORT: '5432'
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-fyc-secrets
  namespace: demo-fyc
type: Opaque
stringData:
  # Valeurs de TP uniquement : en production, le secret ne doit pas être versionné en clair.
  APP_KEY: base64:ZGVtby1meWMtYXBwLWtleS1mb3Ita2luZC1vbmx5ISE=
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_DATABASE: demo_fyc

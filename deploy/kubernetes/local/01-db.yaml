apiVersion: v1
kind: Secret
metadata:
  name: demo-fyc-secrets
  namespace: demo-fyc
type: Opaque
stringData:
  # Valeurs de laboratoire uniquement. Utiliser un gestionnaire de secrets en production.
  APP_KEY: base64:ZGVtby1meWMtYXBwLWtleS1mb3Ita2luZC1vbmx5
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_DATABASE: demo_fyc
---
apiVersion: v1
kind: Service
metadata:
  name: demo-fyc-db
  namespace: demo-fyc
spec:
  selector:
    app: demo-fyc-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-fyc-db
  namespace: demo-fyc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-fyc-db
  template:
    metadata:
      labels:
        app: demo-fyc-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: demo-fyc-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-fyc-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: demo-fyc-secrets
                  key: DB_DATABASE
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: demo-fyc-db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-fyc-db
  namespace: demo-fyc
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 1Gi

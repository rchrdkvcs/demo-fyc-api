apiVersion: v1
kind: Service
metadata:
  name: demo-fyc-db
spec:
  selector:
    app: demo-fyc-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-fyc-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-fyc-db
  template:
    metadata:
      labels:
        app: demo-fyc-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: demo-fyc-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-fyc-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: demo-fyc-secrets
                  key: DB_DATABASE
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: demo-fyc-db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-fyc-db
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 1Gi
